options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SERVICE: transit-tcp-ws-server
  _REGION: europe-west4
  _REPOSITORY: cloud-run-source-deploy
  _ZMQ_ENDPOINT: tcp://pubsub.besteffort.ndovloket.nl:7658
  _ZMQ_TOPICS: /RIG/KV17cvlinfo,/RIG/KV6posinfo
  _ZMQ_TURBO_ENABLED: "true"
  _ZMQ_TURBO_ENDPOINT: tcp://pubsub.besteffort.ndovloket.nl:7817
  _ZMQ_TURBO_TOPICS: /GOVI/KV8passtimes/RET
  _ZMQ_TURBO_ON_DEMAND: "true"
  _ZMQ_TURBO_IDLE_UNSUBSCRIBE_MS: "60000"
  # Beurs tram Coolsingel + Blaak/Westblaak
  _USERSTOPCODES: HA1161,HA1162,HA1141,HA1142
  _GOVI_USERSTOPCODES: HA1161,HA1162,HA1141,HA1142
  # Must stay quoted: # is a YAML/shell comment otherwise
  _LINEPLANNINGNUMBERS: "1###"
  _TRANSIT_TIMEZONE: Europe/Amsterdam
  _NO_TRAIN_INITIAL_DELAY_MS: "5000"
  _NO_TRAIN_AFTER_DEPARTURE_MS: "30000"
  _MAX_PAYLOAD_BYTES: "200000"
  _WS_PING_INTERVAL_MS: "25000"
  _UPCOMING_DISPLAY_LIMIT: "5"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      # Entire flag quoted so LINEPLANNINGNUMBERS=1### is not truncated at #
      - "--set-env-vars=NODE_ENV=production,ZMQ_ENDPOINT=${_ZMQ_ENDPOINT},ZMQ_TOPICS=${_ZMQ_TOPICS},ZMQ_TURBO_ENABLED=${_ZMQ_TURBO_ENABLED},ZMQ_TURBO_ENDPOINT=${_ZMQ_TURBO_ENDPOINT},ZMQ_TURBO_TOPICS=${_ZMQ_TURBO_TOPICS},ZMQ_TURBO_ON_DEMAND=${_ZMQ_TURBO_ON_DEMAND},ZMQ_TURBO_IDLE_UNSUBSCRIBE_MS=${_ZMQ_TURBO_IDLE_UNSUBSCRIBE_MS},USERSTOPCODES=${_USERSTOPCODES},GOVI_USERSTOPCODES=${_GOVI_USERSTOPCODES},LINEPLANNINGNUMBERS=${_LINEPLANNINGNUMBERS},TRANSIT_TIMEZONE=${_TRANSIT_TIMEZONE},NO_TRAIN_INITIAL_DELAY_MS=${_NO_TRAIN_INITIAL_DELAY_MS},NO_TRAIN_AFTER_DEPARTURE_MS=${_NO_TRAIN_AFTER_DEPARTURE_MS},MAX_PAYLOAD_BYTES=${_MAX_PAYLOAD_BYTES},WS_PING_INTERVAL_MS=${_WS_PING_INTERVAL_MS},UPCOMING_DISPLAY_LIMIT=${_UPCOMING_DISPLAY_LIMIT}"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
