<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arrivals &amp; Departures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="stage">
      <div class="board-frame" id="boardFrame">
        <main class="board" id="board">
          <section class="panel panel--arrivals" aria-label="Arrivals">
            <header class="panel-header">
              <h1>Arrivals</h1>
            </header>
            <div class="col-head" aria-hidden="true">
              <span class="col col-status"></span>
              <span class="col col-flight">Flight</span>
              <span class="col col-city">From</span>
              <span class="col col-via">Via</span>
              <span class="col col-time">Sched</span>
              <span class="col col-eta">Expect</span>
              <span class="col col-gate">Gate</span>
              <span class="col col-belt">Belt</span>
              <span class="col col-remark">Status</span>
            </div>
            <div class="flight-list" id="arrivalsList">
              <p class="empty">Loading…</p>
            </div>
            <footer class="panel-footer">
              <span class="footer-mark" aria-hidden="true">i</span>
              <span class="footer-text" id="arrivalsFooter">Arrivals</span>
              <span class="footer-meta">
                <span id="iataLeft">—</span>
                <span class="footer-clock" id="clockLeft">—</span>
              </span>
            </footer>
          </section>

          <section class="panel panel--departures" aria-label="Departures">
            <header class="panel-header">
              <h1>Departure</h1>
            </header>
            <div class="col-head" aria-hidden="true">
              <span class="col col-status"></span>
              <span class="col col-flight">Flight</span>
              <span class="col col-city">To</span>
              <span class="col col-via">Via</span>
              <span class="col col-time">Sched</span>
              <span class="col col-eta">Expect</span>
              <span class="col col-gate">Gate</span>
              <span class="col col-belt">Belt</span>
              <span class="col col-remark">Status</span>
            </div>
            <div class="flight-list" id="departuresList">
              <p class="empty">Loading…</p>
            </div>
            <footer class="panel-footer">
              <span class="footer-mark" aria-hidden="true">i</span>
              <span class="footer-text" id="departuresFooter">Departures</span>
              <span class="footer-meta">
                <span id="iataRight">—</span>
                <span class="footer-clock" id="clockRight">—</span>
              </span>
            </footer>
          </section>
        </main>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
